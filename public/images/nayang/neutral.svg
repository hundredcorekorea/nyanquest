<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="#1a1a2e" stroke="#d97706" stroke-width="2"/>
  <!-- Body -->
  <ellipse cx="64" cy="90" rx="30" ry="22" fill="#f5c542"/>
  <!-- Wizard robe -->
  <path d="M40 82 C40 82 50 75 64 75 C78 75 88 82 88 82 L92 110 L36 110 Z" fill="#4a1d96" stroke="#7c3aed" stroke-width="1"/>
  <!-- Robe collar -->
  <path d="M48 80 C48 76 80 76 80 80" fill="none" stroke="#d97706" stroke-width="2"/>
  <!-- Head -->
  <circle cx="64" cy="52" r="24" fill="#f5c542"/>
  <!-- Left ear -->
  <path d="M42 38 L38 16 L54 32 Z" fill="#f5c542" stroke="#e0a830" stroke-width="1"/>
  <path d="M44 34 L42 20 L52 32 Z" fill="#ffb3c1"/>
  <!-- Right ear -->
  <path d="M86 38 L90 16 L74 32 Z" fill="#f5c542" stroke="#e0a830" stroke-width="1"/>
  <path d="M84 34 L86 20 L76 32 Z" fill="#ffb3c1"/>
  <!-- Eyes -->
  <ellipse cx="54" cy="50" rx="5" ry="5.5" fill="#1a1a2e"/>
  <ellipse cx="74" cy="50" rx="5" ry="5.5" fill="#1a1a2e"/>
  <circle cx="52" cy="48" r="2" fill="white"/>
  <circle cx="72" cy="48" r="2" fill="white"/>
  <!-- Nose -->
  <path d="M62 56 L64 59 L66 56 Z" fill="#ff8fa3"/>
  <!-- Mouth -->
  <path d="M58 62 Q64 67 70 62" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="30" y1="54" x2="48" y2="56" stroke="#e0a830" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="60" x2="48" y2="60" stroke="#e0a830" stroke-width="1" stroke-linecap="round"/>
  <line x1="80" y1="56" x2="98" y2="54" stroke="#e0a830" stroke-width="1" stroke-linecap="round"/>
  <line x1="80" y1="60" x2="98" y2="60" stroke="#e0a830" stroke-width="1" stroke-linecap="round"/>
  <!-- Wizard hat -->
  <path d="M38 40 L64 4 L90 40 Z" fill="#4a1d96"/>
  <path d="M38 40 L64 8 L90 40" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Hat brim -->
  <ellipse cx="64" cy="40" rx="28" ry="6" fill="#4a1d96" stroke="#7c3aed" stroke-width="1"/>
  <!-- Hat star -->
  <path d="M64 18 L66 24 L72 24 L67 28 L69 34 L64 30 L59 34 L61 28 L56 24 L62 24 Z" fill="#d97706"/>
  <!-- Staff/wand hint -->
  <line x1="92" y1="70" x2="100" y2="40" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="38" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
</svg>