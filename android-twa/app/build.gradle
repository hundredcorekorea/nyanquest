apply plugin: 'com.android.application'

android {
    namespace 'com.reaf.nyanquest'
    compileSdk 35

    defaultConfig {
        applicationId "com.reaf.nyanquest"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file('../nyanquest.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'nyanquest2026'
            keyAlias 'nyanquest'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'nyanquest2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
